name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: workbench/package-lock.json

      - name: Build and qualify shared workbench
        working-directory: workbench
        run: |
          npm ci
          npm run build
          npm test
          git diff --exit-code -- ../workbench-dist/ ../assets/icon.png

      - name: Run test suite
        run: python -m pytest -q

      - name: Set up official DSH runtime
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Qualify official DSH MCP connection
        working-directory: workbench
        run: |
          npm install --prefix "$RUNNER_TEMP/relay-dsh-runtime" --no-package-lock --ignore-scripts --no-audit --no-fund \
            @deepseek-ai/cordis@4.1.0 \
            @deepseek-ai/dsh-mcp-client@0.2.2-rc.1 \
            @deepseek-ai/dsh-mcp-resources@0.2.2-rc.1 \
            @deepseek-ai/dsh-tools@0.2.2-rc.1 \
            @deepseek-ai/dsh-system-prompt@0.2.2-rc.1 \
            @deepseek-ai/dsh-tool-executor-native@0.2.2-rc.1
          npm run qualify:dsh -- "$RUNNER_TEMP/relay-dsh-runtime"

      - name: Validate Package v2 structure
        run: |
          python - <<'PY'
          import json
          import tomllib
          from pathlib import Path

          root = Path.cwd().resolve()
          package = json.loads((root / "opl-package.json").read_text(encoding="utf-8"))
          pyproject = tomllib.loads((root / "pyproject.toml").read_text(encoding="utf-8"))

          assert not (root / "plugins" / "opl-relay").exists()
          assert not (root / ".codex-plugin").exists()
          assert not (root / ".agents" / "plugins" / "marketplace.json").exists()

          assert package["schema_version"] == "opl.package.v2"
          assert package["identity"]["id"] == "opl-relay"
          assert package["identity"]["intent"] == "app"
          assert package["identity"]["version"] == pyproject["project"]["version"]
          assert package["identity"]["license"] == "Apache-2.0"
          assert (root / package["identity"]["icon"]).is_file()

          skills = package["provides"]["skills"]
          assert skills
          for skill in skills:
              skill_dir = (root / skill["path"]).resolve()
              skill_dir.relative_to(root)
              assert (skill_dir / "SKILL.md").is_file()

          mcp_servers = {srv["id"]: srv for srv in package["provides"]["mcp_servers"]}
          assert "mail-workbench" in mcp_servers
          for mcp_app in package["ui"]["mcp_apps"]:
              assert mcp_app["mcp_server_id"] in mcp_servers

          assert (root / "workbench-dist" / "server.mjs").is_file()
          assert (root / "workbench-dist" / "index.html").is_file()
          assert package["provides"]["connection_providers"][0]["provider_type"] == "opl-relay.mailbox"
          assert package["provides"]["contribution_handler"]["kind"] == "cli"
          PY
