name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: workbench/package-lock.json

      - name: Build and qualify shared workbench
        working-directory: workbench
        run: |
          npm ci
          npm run build
          npm test
          git diff --exit-code -- ../plugins/opl-relay/workbench/ ../plugins/opl-relay/opl-package.json

      - name: Run test suite
        run: python -m pytest -q

      - name: Set up official DSH runtime
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Qualify official DSH MCP connection
        working-directory: workbench
        run: |
          npm install --prefix "$RUNNER_TEMP/relay-dsh-runtime" --no-package-lock --ignore-scripts --no-audit --no-fund \
            @deepseek-ai/cordis@4.1.0 \
            @deepseek-ai/dsh-mcp-client@0.2.2-rc.1 \
            @deepseek-ai/dsh-mcp-resources@0.2.2-rc.1 \
            @deepseek-ai/dsh-tools@0.2.2-rc.1 \
            @deepseek-ai/dsh-system-prompt@0.2.2-rc.1 \
            @deepseek-ai/dsh-tool-executor-native@0.2.2-rc.1
          npm run qualify:dsh -- "$RUNNER_TEMP/relay-dsh-runtime"

      - name: Validate Plugin structure
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path.cwd().resolve()
          plugin_root = root / "plugins" / "opl-relay"
          plugin = json.loads(
              (plugin_root / ".codex-plugin" / "plugin.json").read_text(encoding="utf-8")
          )
          package = json.loads(
              (plugin_root / "opl-package.json").read_text(encoding="utf-8")
          )
          marketplace = json.loads(
              (root / ".agents" / "plugins" / "marketplace.json").read_text(encoding="utf-8")
          )

          assert plugin["name"] == package["package_id"] == "opl-relay"
          assert plugin["version"] == package["version"]
          assert plugin["license"] == "Apache-2.0"
          assert plugin["skills"] == "./skills/"
          assert (plugin_root / plugin["skills"]).is_dir()
          assert list((plugin_root / plugin["skills"]).glob("*/SKILL.md"))

          entries = marketplace["plugins"]
          assert marketplace["name"] == "opl-relay"
          assert len(entries) == 1
          entry = entries[0]
          assert entry["name"] == "opl-relay"
          assert entry["source"] == {
              "source": "local",
              "path": "./plugins/opl-relay",
          }
          source = (root / entry["source"]["path"]).resolve()
          source.relative_to(root)
          assert source == plugin_root
          assert entry["policy"]["installation"] == "AVAILABLE"
          assert entry["policy"]["authentication"] in {"ON_INSTALL", "ON_USE"}
          assert entry["category"]
          PY

  plugin-installation-qualification:
    name: Codex Plugin installation qualification
    if: github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Exercise Codex Plugin installation
        run: |
          npm install --global @openai/codex@0.145.0
          export CODEX_HOME="$RUNNER_TEMP/codex-home"
          mkdir -p "$CODEX_HOME"
          codex plugin marketplace add "$GITHUB_WORKSPACE" --json
          codex plugin list --marketplace opl-relay --available --json
          codex plugin add opl-relay@opl-relay --json
          codex plugin list --marketplace opl-relay --json
