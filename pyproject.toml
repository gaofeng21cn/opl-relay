[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "opl-relay"
version = "0.7.10"
description = "Local-first personal communication relay for Codex and OPL."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.28,<1",
  "msal>=1.31,<2",
  "pydantic>=2.10,<3",
  "typer>=0.15,<1",
]

[dependency-groups]
dev = [
  "pytest>=8,<10",
  "ruff>=0.9,<1",
]

[project.scripts]
opl-relay = "codex_mail_workbench.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["runtime/codex_mail_workbench"]

[tool.pytest.ini_options]
pythonpath = ["runtime"]
testpaths = ["tests"]
