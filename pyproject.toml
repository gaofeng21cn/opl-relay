[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "opl-relay"
version = "0.5.1"
description = "Local-first personal communication relay for Codex and OPL."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
opl-relay = "codex_mail_workbench.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["plugins/opl-relay/runtime/codex_mail_workbench"]

[tool.pytest.ini_options]
pythonpath = ["plugins/opl-relay/runtime"]
testpaths = ["tests"]
