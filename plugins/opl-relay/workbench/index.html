<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>OPL Relay · 邮箱工作台</title>
  <style>:root {
  color-scheme: light;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif;
  font-size: 14px;
  font-synthesis: none;
  color: #171717;
  background: #f5f5f5;
  --canvas: #f5f5f5;
  --surface: #fff;
  --soft: #f6f6f6;
  --soft-strong: #f0f0f0;
  --line: #e7e7e7;
  --muted: #666;
  --muted-strong: #666;
  --black: #171717;
  --blue: #0064b5;
  --blue-soft: #eaf4ff;
  --green: #28bd6a;
  --radius: 14px;
  --focus: #006fc9;
}

* { box-sizing: border-box; }
body { min-width: 320px; margin: 0; background: var(--canvas); }
::selection { color: #fff; background: var(--black); }
button, input, select, textarea { font: inherit; color: inherit; }
button, select, input, textarea, summary { -webkit-tap-highlight-color: transparent; }
button { cursor: pointer; }
button:focus-visible, select:focus-visible, input:focus-visible, textarea:focus-visible, summary:focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }
button:disabled { cursor: default; opacity: .55; }
[hidden] { display: none !important; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
.icon, .chrome-icon { width: 20px; height: 20px; flex: 0 0 auto; fill: none; stroke: currentColor; stroke-width: 1.65; stroke-linecap: round; stroke-linejoin: round; }

.app-frame { min-height: 100dvh; background: var(--surface); }
.chrome-bar { position: relative; z-index: 2; display: flex; align-items: center; justify-content: space-between; height: 62px; padding: 0 18px; border-bottom: 1px solid var(--line); background: var(--canvas); }
.chrome-left, .chrome-right { display: flex; align-items: center; gap: 15px; min-width: 100px; }
.chrome-right { justify-content: flex-end; }
.chrome-button { display: inline-flex; align-items: center; justify-content: center; width: 30px; height: 30px; padding: 0; border: 0; border-radius: 8px; color: #767676; background: transparent; }
.chrome-button:hover { color: var(--black); background: var(--soft-strong); }
.chrome-icon { width: 21px; height: 21px; stroke-width: 1.55; }
.run-stop { width: 17px; height: 17px; border-radius: 5px; background: #ff3e52; box-shadow: inset 0 0 0 1px rgba(0,0,0,.04); }
.window-title { position: absolute; left: 50%; display: flex; align-items: center; gap: 10px; min-width: 360px; padding: 10px 18px; border-radius: 999px; background: #ededed; transform: translateX(-50%); }
.window-title strong { font-size: 16px; font-weight: 550; letter-spacing: -.2px; }
.window-logo { display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 28px; border-radius: 8px; color: #168bff; background: #fff; box-shadow: 0 2px 7px rgba(0,0,0,.08); }
.window-logo svg { width: 21px; height: 21px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.live-status { display: inline-flex; align-items: center; gap: 6px; margin-left: 4px; color: var(--blue); font-size: 14px; }
.live-status i { width: 8px; height: 8px; border-radius: 50%; background: var(--blue); }

.workspace { display: grid; grid-template-columns: 220px 390px minmax(0, 1fr); height: calc(100dvh - 62px); min-height: 540px; background: var(--surface); }
.workspace:has(.composer:not([hidden])) { grid-template-columns: 220px 350px minmax(0, 1fr); }
.workspace:has(.composer:not([hidden])) .reader { display: none; }
.workspace:has(.composer:not([hidden])) .composer { grid-column: 3; }
.workspace.view-source:has(.composer:not([hidden])) { grid-template-columns: 220px 350px minmax(0, 1fr) minmax(390px, 520px); }
.workspace.view-source:has(.composer:not([hidden])) .reader { display: flex; }
.workspace.view-source:has(.composer:not([hidden])) .composer { grid-column: auto; }
.sidebar { display: flex; flex-direction: column; min-width: 0; padding: 28px 18px 22px; border-right: 1px solid var(--line); background: var(--surface); }
.sidebar-brand { display: flex; align-items: center; gap: 12px; padding: 0 12px 25px; font-size: 20px; font-weight: 650; letter-spacing: -.5px; }
.brand-mark { display: inline-flex; align-items: center; justify-content: center; width: 27px; height: 27px; color: var(--blue); }
.brand-mark svg { width: 27px; height: 27px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.compose-button { display: inline-flex; align-items: center; justify-content: flex-start; gap: 13px; width: 100%; min-height: 52px; padding: 0 23px; border: 0; border-radius: 13px; color: #fff; background: var(--black); font-size: 16px; font-weight: 600; }
.compose-button:hover { background: #343434; }
.compose-button .icon { width: 22px; height: 22px; stroke-width: 1.7; }
.primary-nav { display: flex; flex-direction: column; gap: 5px; margin-top: 28px; }
.nav-button, .select-nav { display: flex; align-items: center; gap: 15px; width: 100%; min-height: 45px; padding: 0 24px; border: 0; border-radius: 12px; color: #656565; background: transparent; text-align: left; font-size: 16px; font-weight: 500; }
.nav-button:hover, .select-nav:hover { color: var(--black); background: var(--soft); }
.nav-button.active { color: var(--black); background: #f1f1f1; font-weight: 650; }
.nav-button .icon { width: 21px; height: 21px; stroke-width: 1.55; }
.sidebar-bottom { display: flex; flex-direction: column; gap: 7px; margin-top: auto; }
.select-nav { justify-content: space-between; min-height: 49px; padding: 0 20px; border: 1px solid var(--line); background: var(--surface); }
.select-nav .icon { width: 16px; height: 16px; }
.sidebar-bottom .nav-button { padding-left: 20px; }
.unsupported-action { position: relative; }

.mail-list { display: flex; flex-direction: column; min-width: 0; min-height: 0; border-right: 1px solid var(--line); background: var(--surface); }
.account-bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 86px; padding: 20px 24px 16px; border-bottom: 1px solid var(--line); }
.account-select { display: flex; align-items: center; gap: 10px; min-width: 0; max-width: 100%; padding: 0 13px; border: 1px solid #dedede; border-radius: 13px; background: var(--surface); }
.account-select .icon { color: #6e6e6e; width: 19px; height: 19px; }
.account-select select { min-width: 0; width: 100%; height: 46px; padding: 0 30px 0 0; border: 0; outline: 0; background: transparent; font-size: 15px; text-overflow: ellipsis; }
.refresh-state { display: flex; align-items: center; gap: 9px; min-width: 0; color: #666; font-size: 12px; white-space: nowrap; }
.refresh-state #freshness { overflow: hidden; text-overflow: ellipsis; }
.refresh-label { color: #111; font-size: 13px; font-weight: 550; }
.list-heading { padding: 30px 25px 17px; }
.list-heading h1 { margin: 0; font-size: 25px; line-height: 1.15; font-weight: 650; letter-spacing: -.75px; }
#search-form { display: flex; align-items: center; gap: 12px; height: 52px; margin: 0 24px 20px; padding: 0 17px 0 19px; border: 1px solid #e5e5e5; border-radius: 15px; background: #fafafa; }
#search-form:focus-within { border-color: #bdbdbd; box-shadow: 0 0 0 3px rgba(20,135,255,.09); }
#search { width: 100%; min-width: 0; height: 100%; padding: 0; border: 0; outline: 0; background: transparent; font-size: 14px; }
#search::placeholder { color: #6f6f6f; opacity: 1; }
.search-icon { width: 21px; height: 21px; color: #787878; }
.list-controls { display: flex; align-items: center; gap: 6px; min-height: 39px; padding: 0 24px; }
.folder-filter, .control-button, .icon-button { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 35px; padding: 0 7px; border: 0; border-radius: 9px; color: #6a6a6a; background: transparent; }
.folder-filter { justify-content: flex-start; flex: 1 1 auto; min-width: 0; padding-left: 0; color: #666; font-size: 14px; }
.folder-filter span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.folder-filter .icon { width: 16px; height: 16px; }
.control-button { gap: 10px; color: #555; font-size: 14px; white-space: nowrap; }
.control-button .icon { width: 19px; height: 19px; }
.icon-button { width: 34px; padding: 0; }
.icon-button:hover, .folder-filter:hover, .control-button:hover { color: var(--black); background: var(--soft); }
.filter-tabs { display: flex; align-items: center; gap: 4px; width: max-content; min-width: 184px; margin: 16px 24px 12px; padding: 4px; border-radius: 11px; background: #f1f1f1; }
.filter-tab { min-width: 55px; min-height: 34px; padding: 0 13px; border: 0; border-radius: 8px; color: #666; background: transparent; font-size: 14px; }
.filter-tab:hover { color: #333; }
.filter-tab.active { color: #151515; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.08); font-weight: 600; }
.list-meta { display: flex; justify-content: space-between; gap: 10px; padding: 0 25px 12px; color: #666; font-size: 12px; }
.list-meta strong { color: #585858; font-weight: 500; }
.message-list { flex: 1; min-height: 0; padding: 0 12px 24px; overflow: auto; overscroll-behavior: contain; }
.message-row { position: relative; display: block; width: 100%; min-height: 100px; margin: 0 0 8px; padding: 17px 19px; border: 1px solid transparent; border-radius: 14px; background: #f7f7f7; text-align: left; overflow: hidden; }
.message-row:hover { border-color: #e1e1e1; background: #f5f5f5; }
.message-row.active { border-color: #e1e1e1; background: #f2f2f2; }
.message-row.active::before { position: absolute; top: 18px; bottom: 18px; left: 0; width: 3px; border-radius: 0 3px 3px 0; background: var(--black); content: ""; }
.message-row:focus-visible { outline-offset: -3px; }
.row-top { display: flex; align-items: baseline; justify-content: space-between; gap: 14px; margin-bottom: 8px; line-height: 1.35; }
.sender { min-width: 0; overflow: hidden; color: #252525; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; font-weight: 600; }
.row-top time { flex: 0 0 auto; color: #8a8a8a; font-size: 12px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.row-subject { display: -webkit-box; overflow: hidden; color: #2b2b2b; font-size: 14px; font-weight: 550; line-height: 1.5; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow-wrap: anywhere; }
.row-footer { margin-top: 8px; color: #909090; font-size: 12px; line-height: 1.45; }

.reader { display: flex; flex-direction: column; min-width: 0; min-height: 0; overflow: hidden; background: var(--surface); }
.reader-toolbar { display: flex; align-items: center; gap: 12px; min-height: 80px; padding: 20px 34px; border-bottom: 1px solid var(--line); }
.reader-toolbar:empty { min-height: 0; padding: 0; border-bottom: 0; }
.reader-toolbar .toolbar-spacer { flex: 1; }
.reader-toolbar button { min-height: 42px; padding: 0 15px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); font-size: 14px; white-space: nowrap; flex-shrink: 0; }
.reader-toolbar button:hover { border-color: #bcbcbc; background: var(--soft); }
.reader-toolbar .primary { border-color: var(--black); color: #fff; background: var(--black); font-weight: 600; }
.reader-toolbar .primary:hover { border-color: #333; background: #333; }
.reader-toolbar .icon-button { width: 42px; padding: 0; border: 0; color: #555; }
.reader-toolbar .soft-action { color: #333; }
.reader-content { min-height: 100%; padding: 46px 50px 58px; overflow: auto; }
.empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 330px; height: 100%; padding: 32px; color: var(--muted); text-align: center; }
.empty-icon { display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 28px; margin-bottom: 14px; color: #666; }
.empty-icon svg { width: 26px; height: 26px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
.empty-state h2 { margin: 0 0 10px; color: #333; font-size: 20px; font-weight: 600; }
.empty-state p { margin: 0; color: #666; font-size: 14px; line-height: 1.8; }
.reader-heading { display: flex; align-items: flex-start; justify-content: space-between; gap: 18px; max-width: 980px; margin: 0 auto 25px; }
.reader-heading h2 { margin: 0; color: #202020; font-size: 27px; line-height: 1.3; font-weight: 650; letter-spacing: -.75px; overflow-wrap: anywhere; }
.badge { flex: 0 0 auto; padding: 6px 10px; border-radius: 999px; color: #777; background: #f3f3f3; font-size: 12px; white-space: nowrap; }
.headers { max-width: 980px; margin: 0 auto 30px; padding: 0 0 25px; border-bottom: 1px solid var(--line); color: #595959; font-size: 13px; line-height: 1.7; overflow-wrap: anywhere; }
.header-row { display: grid; grid-template-columns: 48px minmax(0, 1fr); gap: 14px; margin: 6px 0; }
.header-label { color: #9a9a9a; }
.message-body { max-width: 980px; margin: 0 auto; color: #3d3d3d; white-space: pre-wrap; overflow-wrap: anywhere; font-family: inherit; font-size: 15px; line-height: 1.9; }
.html-message { display: block; width: min(980px, 100%); height: 60dvh; margin: 0 auto; border: 0; background: var(--surface); }
.attachments { display: flex; flex-wrap: wrap; gap: 9px; max-width: 980px; margin: 24px auto 0; }
.attachment { display: inline-flex; align-items: center; gap: 8px; min-height: 35px; padding: 5px 11px; border: 1px solid var(--line); border-radius: 9px; color: #4f4f4f; background: #fafafa; font-size: 12px; }
.attachment:hover { border-color: #bdbdbd; background: var(--soft); }
.reader-actions { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; max-width: 980px; margin: 34px auto 0; padding-top: 20px; border-top: 1px solid var(--line); }
.reader-actions button { min-height: 38px; padding: 0 13px; border: 1px solid var(--line); border-radius: 10px; background: #fff; font-size: 13px; }

.composer { min-width: 0; min-height: 0; overflow: auto; border-left: 1px solid var(--line); background: #fafafa; }
.composer-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; padding: 30px 26px 21px; border-bottom: 1px solid var(--line); }
.composer-top h2 { margin: 0; font-size: 21px; line-height: 1.35; font-weight: 650; }
.composer-tools { display: flex; align-items: center; gap: 7px; }
.edit-status { padding: 5px 8px; border-radius: 999px; color: #666; background: #eeeeee; font-size: 11px; white-space: nowrap; }
.edit-status.unsaved { color: #7b4a00; background: #fff0cd; }
.source-toggle { min-height: 30px; padding: 0 8px; border: 0; border-radius: 8px; background: transparent; color: #777; font-size: 12px; }
.composer > .headers { margin: 22px 26px 18px; padding: 0 0 18px; font-size: 12px; }
.composer > label { display: block; margin: 0 26px 9px; color: #777; font-size: 12px; font-weight: 550; }
.reply-editor { display: block; width: calc(100% - 52px); min-height: 245px; margin: 0 26px; padding: 15px; border: 1px solid var(--line); border-radius: 12px; outline: 0; resize: vertical; background: #fff; font-size: 14px; line-height: 1.75; }
.reply-editor:focus { border-color: #a6a6a6; box-shadow: 0 0 0 3px rgba(20,135,255,.08); }
.signature { margin: 18px 26px 0; padding: 15px; border: 1px solid var(--line); border-radius: 12px; color: #666; background: #f5f5f5; white-space: pre-wrap; font-size: 12px; line-height: 1.7; }
.composer .attachments { margin: 18px 26px 0; }
.quoted { margin: 21px 26px 0; border-top: 1px solid var(--line); }
.quoted details { padding-top: 16px; }
.quoted summary { color: #777; cursor: pointer; font-size: 12px; }
.quoted pre { max-height: 220px; margin-top: 13px; padding: 14px; overflow: auto; border-radius: 10px; color: #727272; background: #f2f2f2; white-space: pre-wrap; font: inherit; font-size: 12px; line-height: 1.7; }
.composer-actions { display: flex; flex-wrap: wrap; gap: 8px; padding: 22px 26px 30px; }
.composer-actions button, .dialog-actions button { min-height: 40px; padding: 0 14px; border: 1px solid var(--line); border-radius: 10px; background: #fff; font-size: 13px; }
.composer-actions .primary, .dialog-actions .primary { color: #fff; border-color: var(--black); background: var(--black); font-weight: 600; }
.composer-actions .primary:hover, .dialog-actions .primary:hover { background: #333; }

.notice { position: fixed; right: 24px; bottom: 24px; z-index: 10; max-width: min(420px, calc(100vw - 48px)); padding: 13px 17px; border: 1px solid #dcdcdc; border-radius: 12px; color: #333; background: #fff; box-shadow: 0 10px 28px rgba(0,0,0,.12); font-size: 13px; line-height: 1.5; }
.notice.error { color: #8a1c1c; border-color: #f0c3c3; background: #fff7f7; }
dialog { width: min(650px, calc(100vw - 32px)); max-height: min(760px, calc(100dvh - 32px)); padding: 26px; border: 1px solid var(--line); border-radius: 16px; background: #fff; box-shadow: 0 24px 70px rgba(0,0,0,.24); }
dialog::backdrop { background: rgba(0,0,0,.28); }
dialog h2 { margin: 0 0 20px; font-size: 20px; }
.review-body { max-height: 360px; padding: 16px; overflow: auto; border-radius: 11px; background: #f5f5f5; white-space: pre-wrap; font-size: 13px; line-height: 1.75; }
.dialog-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 22px; }
.preview-image { display: block; max-width: 100%; max-height: 65dvh; margin: 0 auto; object-fit: contain; }
.preview-pdf { width: 100%; height: 65dvh; border: 0; }
dialog a { display: inline-flex; align-items: center; min-height: 40px; padding: 0 14px; border: 1px solid var(--line); border-radius: 10px; color: #333; text-decoration: none; font-size: 13px; }

@media (max-width: 1260px) {
  .workspace { grid-template-columns: 190px 350px minmax(0, 1fr); }
  .workspace:has(.composer:not([hidden])) { grid-template-columns: 190px 320px minmax(0, 1fr); }
  .workspace.view-source:has(.composer:not([hidden])) { grid-template-columns: 190px 320px minmax(0, 1fr) minmax(350px, 430px); }
  .sidebar { padding-left: 12px; padding-right: 12px; }
  .nav-button, .select-nav { padding-left: 17px; padding-right: 17px; }
  .reader-content { padding-left: 34px; padding-right: 34px; }
  .reader-toolbar { padding-left: 24px; padding-right: 24px; }
}

@media (max-width: 900px) {
  .window-title { min-width: 0; padding: 9px 13px; }
  .window-title strong { font-size: 14px; }
  .live-status { font-size: 12px; }
  .workspace, .workspace:has(.composer:not([hidden])), .workspace.view-source:has(.composer:not([hidden])) { grid-template-columns: 178px minmax(300px, 0.9fr) minmax(360px, 1.1fr); }
  .workspace:has(.composer:not([hidden])) .reader, .workspace.view-source:has(.composer:not([hidden])) .reader { display: flex; }
  .workspace:has(.composer:not([hidden])) .composer, .workspace.view-source:has(.composer:not([hidden])) .composer { grid-column: auto; }
  .sidebar-brand { padding-left: 8px; font-size: 17px; }
  .compose-button { padding-left: 16px; }
  .nav-button, .select-nav { padding-left: 12px; padding-right: 12px; font-size: 14px; }
  .reader-content { padding: 34px 28px 45px; }
}

@media (max-width: 720px) {
  .chrome-bar { height: 56px; padding: 0 10px; }
  .chrome-left, .chrome-right { min-width: 74px; gap: 4px; }
  .chrome-right .chrome-button:first-child { display: none; }
  .window-title { position: static; min-width: 0; flex: 1; transform: none; }
  .window-title strong { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .live-status { display: none; }
  .workspace, .workspace:has(.composer:not([hidden])) { display: flex; flex-direction: column; height: auto; min-height: calc(100dvh - 56px); }
  .sidebar { flex: 0 0 auto; display: block; padding: 13px 12px 10px; border-right: 0; border-bottom: 1px solid var(--line); overflow-x: auto; }
  .sidebar-brand { display: none; }
  .compose-button { display: inline-flex; width: auto; min-height: 40px; padding: 0 16px; font-size: 14px; vertical-align: middle; }
  .primary-nav { display: inline-flex; flex-direction: row; gap: 3px; margin: 0 0 0 8px; vertical-align: middle; }
  .nav-button { width: auto; min-height: 40px; padding: 0 12px; white-space: nowrap; }
  .nav-button .icon { width: 17px; height: 17px; }
  .nav-button span { display: none; }
  .sidebar-bottom { display: none; }
  .mail-list { flex: 0 0 600px; border-right: 0; border-bottom: 1px solid var(--line); }
  .reader { flex: 1 0 620px; min-height: 620px; overflow: visible; }
  .reader-toolbar { min-height: 72px; padding: 16px 20px; overflow-x: auto; }
  .reader-content { overflow: visible; padding: 30px 20px 50px; }
  .reader-heading h2 { font-size: 23px; }
  .composer { flex: 1 0 620px; min-height: 620px; border-left: 0; border-top: 1px solid var(--line); }
  .refresh-state { display: none; }
}
</style>
</head>
<body>
  <div class="app-frame">
    <header class="chrome-bar">
      <div class="chrome-left">
        <button id="sync" class="chrome-button" type="button" aria-label="同步邮件" title="同步邮件">
          <svg class="chrome-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 0 0-14.7-4.3L3 9m0 0V4m0 5h5M4 13a8 8 0 0 0 14.7 4.3L21 15m0 0v5m0-5h-5"/></svg>
        </button>
        <span class="run-stop" aria-label="本地工作台运行中" title="本地工作台运行中"></span>
      </div>
      <div class="window-title" aria-label="OPL Relay 邮箱工作台">
        <span class="window-logo"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="m4 7 8 6 8-6"/></svg></span>
        <strong>Email Workbench</strong>
        <span class="live-status"><i></i>运行中</span>
      </div>
      <div class="chrome-right">
        <button class="chrome-button unsupported-action" type="button" aria-label="全屏" title="全屏暂未接入">
          <svg class="chrome-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H5a2 2 0 0 0-2 2v3m13-5h3a2 2 0 0 1 2 2v3M8 21H5a2 2 0 0 1-2-2v-3m13 5h3a2 2 0 0 0 2-2v-3"/></svg>
