<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>OPL Relay · 邮箱工作台</title>
  <style>:root {
  color-scheme: light dark;
  font-family: var(--font-sans, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif);
  font-size: 14px;
  font-synthesis: none;
  color: var(--black);
  background: var(--canvas);
  --canvas: var(--color-background-secondary, var(--palette-canvas));
  --surface: var(--color-background-primary, var(--palette-surface));
  --soft: var(--color-background-tertiary, var(--palette-soft));
  --soft-strong: var(--color-background-secondary, var(--palette-strong));
  --line: var(--color-border-primary, var(--palette-line));
  --muted: var(--color-text-secondary, var(--palette-muted));
  --muted-strong: var(--muted);
  --black: var(--color-text-primary, var(--palette-text));
  --inverse: var(--color-text-inverse, var(--palette-surface));
  --blue: var(--color-text-info, var(--palette-blue));
  --blue-soft: var(--color-background-info, var(--palette-soft));
  --green: var(--color-text-success, #28bd6a);
  --danger: var(--color-text-danger, var(--palette-danger));
  --danger-bg: var(--color-background-danger, var(--palette-danger-bg));
  --warning: var(--color-text-warning, var(--palette-warning));
  --warning-bg: var(--color-background-warning, var(--palette-warning-bg));
  --radius: var(--border-radius-lg, 14px);
  --focus: var(--color-ring-primary, var(--blue));
  --chrome-height: 62px;
  --palette-canvas: #f5f5f5;
  --palette-surface: #fff;
  --palette-soft: #f6f6f6;
  --palette-strong: #ededed;
  --palette-line: #e1e1e1;
  --palette-muted: #666;
  --palette-text: #171717;
  --palette-blue: #0064b5;
  --palette-danger: #8a1c1c;
  --palette-danger-bg: #fff7f7;
  --palette-warning: #7b4a00;
  --palette-warning-bg: #fff0cd;
}

:root[data-theme="dark"] {
  --palette-canvas: #17191c;
  --palette-surface: #202328;
  --palette-soft: #292d33;
  --palette-strong: #343941;
  --palette-line: #454b55;
  --palette-muted: #b3bac5;
  --palette-text: #edf0f5;
  --palette-blue: #86c3ff;
  --palette-danger: #ffb4b4;
  --palette-danger-bg: #442b30;
  --palette-warning: #f5d28e;
  --palette-warning-bg: #423a29;
}

* { box-sizing: border-box; }
body { min-width: 320px; margin: 0; background: var(--canvas); }
::selection { color: var(--inverse); background: var(--black); }
button, input, select, textarea { font: inherit; color: inherit; }
button, select, input, textarea, summary { -webkit-tap-highlight-color: transparent; }
button { cursor: pointer; }
button:focus-visible, select:focus-visible, input:focus-visible, textarea:focus-visible, summary:focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }
button:disabled { cursor: default; opacity: .55; }
[hidden] { display: none !important; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
.icon, .chrome-icon { width: 20px; height: 20px; flex: 0 0 auto; fill: none; stroke: currentColor; stroke-width: 1.65; stroke-linecap: round; stroke-linejoin: round; }

.app-frame { min-height: 100dvh; background: var(--surface); }
.chrome-bar { position: relative; z-index: 2; display: flex; align-items: center; justify-content: space-between; height: var(--chrome-height); padding: 0 18px; border-bottom: 1px solid var(--line); background: var(--canvas); }
.chrome-left, .chrome-right { display: flex; align-items: center; gap: 15px; min-width: 100px; }
.chrome-right { justify-content: flex-end; }
.chrome-button { display: inline-flex; align-items: center; justify-content: center; width: 30px; height: 30px; padding: 0; border: 0; border-radius: 8px; color: var(--muted); background: transparent; }
.chrome-button:hover { color: var(--black); background: var(--soft-strong); }
.chrome-icon { width: 21px; height: 21px; stroke-width: 1.55; }
.run-stop { width: 17px; height: 17px; border-radius: 5px; background: #ff3e52; box-shadow: inset 0 0 0 1px rgba(0,0,0,.04); }
.window-title { position: absolute; left: 50%; display: flex; align-items: center; gap: 10px; min-width: 360px; padding: 10px 18px; border-radius: 999px; background: var(--soft-strong); transform: translateX(-50%); }
.window-title strong { font-size: 16px; font-weight: 550; letter-spacing: -.2px; }
.window-logo { display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 28px; border-radius: 8px; color: #168bff; background: var(--surface); box-shadow: 0 2px 7px rgba(0,0,0,.08); }
.window-logo svg { width: 21px; height: 21px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.live-status { display: inline-flex; align-items: center; gap: 6px; margin-left: 4px; color: var(--blue); font-size: 14px; }
.live-status i { width: 8px; height: 8px; border-radius: 50%; background: var(--blue); }

.workspace { display: grid; grid-template-columns: 220px 390px minmax(0, 1fr); height: calc(min(100dvh, var(--host-max-height, 100dvh)) - var(--chrome-height)); min-height: 0; background: var(--surface); }
.workspace:has(.composer:not([hidden])) { grid-template-columns: 220px 350px minmax(0, 1fr); }
.workspace:has(.composer:not([hidden])) .reader { display: none; }
.workspace:has(.composer:not([hidden])) .composer { grid-column: 3; }
.workspace.view-source:has(.composer:not([hidden])) { grid-template-columns: 220px 350px minmax(0, 1fr) minmax(390px, 520px); }
.workspace.view-source:has(.composer:not([hidden])) .reader { display: flex; }
.workspace.view-source:has(.composer:not([hidden])) .composer { grid-column: auto; }
.sidebar { display: flex; flex-direction: column; min-width: 0; padding: 28px 18px 22px; border-right: 1px solid var(--line); background: var(--surface); }
.sidebar-brand { display: flex; align-items: center; gap: 12px; padding: 0 12px 25px; font-size: 20px; font-weight: 650; letter-spacing: -.5px; }
.brand-mark { display: inline-flex; align-items: center; justify-content: center; width: 27px; height: 27px; color: var(--blue); }
.brand-mark svg { width: 27px; height: 27px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.compose-button { display: inline-flex; align-items: center; justify-content: flex-start; gap: 13px; width: 100%; min-height: 52px; padding: 0 23px; border: 0; border-radius: 13px; color: var(--inverse); background: var(--black); font-size: 16px; font-weight: 600; }
.compose-button:hover { background: var(--black); }
.compose-button .icon { width: 22px; height: 22px; stroke-width: 1.7; }
.primary-nav { display: flex; flex-direction: column; gap: 5px; margin-top: 28px; }
.nav-button, .select-nav { display: flex; align-items: center; gap: 15px; width: 100%; min-height: 45px; padding: 0 24px; border: 0; border-radius: 12px; color: var(--muted); background: transparent; text-align: left; font-size: 16px; font-weight: 500; }
.nav-button:hover, .select-nav:hover { color: var(--black); background: var(--soft); }
.nav-button.active { color: var(--black); background: var(--soft-strong); font-weight: 650; }
.nav-button .icon { width: 21px; height: 21px; stroke-width: 1.55; }
.sidebar-bottom { display: flex; flex-direction: column; gap: 7px; margin-top: auto; }
.select-nav { justify-content: space-between; min-height: 49px; padding: 0 20px; border: 1px solid var(--line); background: var(--surface); }
.select-nav .icon { width: 16px; height: 16px; }
.sidebar-bottom .nav-button { padding-left: 20px; }
.unsupported-action { position: relative; }

.mail-list { display: flex; flex-direction: column; min-width: 0; min-height: 0; border-right: 1px solid var(--line); background: var(--surface); }
.account-bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 86px; padding: 20px 24px 16px; border-bottom: 1px solid var(--line); }
.account-select { display: flex; align-items: center; gap: 10px; min-width: 0; max-width: 100%; padding: 0 13px; border: 1px solid var(--line); border-radius: 13px; background: var(--surface); }
.account-select .icon { color: var(--muted); width: 19px; height: 19px; }
.account-select select { min-width: 0; width: 100%; height: 46px; padding: 0 30px 0 0; border: 0; outline: 0; background: transparent; font-size: 15px; text-overflow: ellipsis; }
.refresh-state { display: flex; align-items: center; gap: 9px; min-width: 0; color: var(--muted); font-size: 12px; white-space: nowrap; }
.refresh-state #freshness { overflow: hidden; text-overflow: ellipsis; }
.refresh-label { color: var(--black); font-size: 13px; font-weight: 550; }
.list-heading { padding: 30px 25px 17px; }
.list-heading h1 { margin: 0; font-size: 25px; line-height: 1.15; font-weight: 650; letter-spacing: -.75px; }
#search-form { display: flex; align-items: center; gap: 12px; height: 52px; margin: 0 24px 20px; padding: 0 17px 0 19px; border: 1px solid var(--line); border-radius: 15px; background: var(--surface); }
#search-form:focus-within { border-color: var(--line); box-shadow: 0 0 0 3px rgba(20,135,255,.09); }
#search { width: 100%; min-width: 0; height: 100%; padding: 0; border: 0; outline: 0; background: transparent; font-size: 14px; }
#search::placeholder { color: var(--muted); opacity: 1; }
.search-icon { width: 21px; height: 21px; color: var(--muted); }
.list-controls { display: flex; align-items: center; gap: 6px; min-height: 39px; padding: 0 24px; }
.folder-filter, .control-button, .icon-button { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 35px; padding: 0 7px; border: 0; border-radius: 9px; color: var(--muted); background: transparent; }
.folder-filter { justify-content: flex-start; flex: 1 1 auto; min-width: 0; padding-left: 0; color: var(--muted); font-size: 14px; }
.folder-filter span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.folder-filter .icon { width: 16px; height: 16px; }
.control-button { gap: 10px; color: var(--muted); font-size: 14px; white-space: nowrap; }
.control-button .icon { width: 19px; height: 19px; }
.icon-button { width: 34px; padding: 0; }
.icon-button:hover, .folder-filter:hover, .control-button:hover { color: var(--black); background: var(--soft); }
.filter-tabs { display: flex; align-items: center; gap: 4px; width: max-content; min-width: 184px; margin: 16px 24px 12px; padding: 4px; border-radius: 11px; background: var(--soft-strong); }
.filter-tab { min-width: 55px; min-height: 34px; padding: 0 13px; border: 0; border-radius: 8px; color: var(--muted); background: transparent; font-size: 14px; }
.filter-tab:hover { color: var(--black); }
.filter-tab.active { color: var(--black); background: var(--surface); box-shadow: 0 1px 3px rgba(0,0,0,.08); font-weight: 600; }
.list-meta { display: flex; justify-content: space-between; gap: 10px; padding: 0 25px 12px; color: var(--muted); font-size: 12px; }
.list-meta strong { color: var(--muted); font-weight: 500; }
.message-list { flex: 1; min-height: 0; padding: 0 12px 24px; overflow: auto; overscroll-behavior: contain; }
.message-row { position: relative; display: block; width: 100%; min-height: 100px; margin: 0 0 8px; padding: 17px 19px; border: 1px solid transparent; border-radius: 14px; background: var(--soft); text-align: left; overflow: hidden; }
.message-row:hover { border-color: var(--line); background: var(--canvas); }
.message-row.active { border-color: var(--line); background: var(--soft-strong); }
.message-row.active::before { position: absolute; top: 18px; bottom: 18px; left: 0; width: 3px; border-radius: 0 3px 3px 0; background: var(--black); content: ""; }
.message-row:focus-visible { outline-offset: -3px; }
.row-top { display: flex; align-items: baseline; justify-content: space-between; gap: 14px; margin-bottom: 8px; line-height: 1.35; }
.sender { min-width: 0; overflow: hidden; color: var(--black); text-overflow: ellipsis; white-space: nowrap; font-size: 13px; font-weight: 600; }
.row-top time { flex: 0 0 auto; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.row-subject { display: -webkit-box; overflow: hidden; color: var(--black); font-size: 14px; font-weight: 550; line-height: 1.5; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow-wrap: anywhere; }
.row-footer { margin-top: 8px; color: var(--muted); font-size: 12px; line-height: 1.45; }

.reader { display: flex; flex-direction: column; min-width: 0; min-height: 0; overflow: hidden; background: var(--surface); }
.reader-toolbar { display: flex; align-items: center; gap: 12px; min-height: 80px; padding: 20px 34px; border-bottom: 1px solid var(--line); }
.reader-toolbar:empty { min-height: 0; padding: 0; border-bottom: 0; }
.reader-toolbar .toolbar-spacer { flex: 1; }
.reader-toolbar button { min-height: 42px; padding: 0 15px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); font-size: 14px; white-space: nowrap; flex-shrink: 0; }
.reader-toolbar button:hover { border-color: var(--line); background: var(--soft); }
.reader-toolbar .primary { border-color: var(--black); color: var(--inverse); background: var(--black); font-weight: 600; }
.reader-toolbar .primary:hover { border-color: var(--black); background: var(--black); }
.reader-toolbar .icon-button { width: 42px; padding: 0; border: 0; color: var(--muted); }
.reader-toolbar .soft-action { color: var(--black); }
.reader-content { min-height: 100%; padding: 46px 50px 58px; overflow: auto; }
.empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 330px; height: 100%; padding: 32px; color: var(--muted); text-align: center; }
.empty-icon { display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 28px; margin-bottom: 14px; color: var(--muted); }
.empty-icon svg { width: 26px; height: 26px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
.empty-state h2 { margin: 0 0 10px; color: var(--black); font-size: 20px; font-weight: 600; }
.empty-state p { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.8; }
.reader-heading { display: flex; align-items: flex-start; justify-content: space-between; gap: 18px; max-width: 980px; margin: 0 auto 25px; }
.reader-heading h2 { margin: 0; color: var(--black); font-size: 27px; line-height: 1.3; font-weight: 650; letter-spacing: -.75px; overflow-wrap: anywhere; }
.badge { flex: 0 0 auto; padding: 6px 10px; border-radius: 999px; color: var(--muted); background: var(--soft-strong); font-size: 12px; white-space: nowrap; }
.headers { max-width: 980px; margin: 0 auto 30px; padding: 0 0 25px; border-bottom: 1px solid var(--line); color: var(--muted); font-size: 13px; line-height: 1.7; overflow-wrap: anywhere; }
.header-row { display: grid; grid-template-columns: 48px minmax(0, 1fr); gap: 14px; margin: 6px 0; }
.header-label { color: var(--muted); }
.message-body { max-width: 980px; margin: 0 auto; color: var(--black); white-space: pre-wrap; overflow-wrap: anywhere; font-family: inherit; font-size: 15px; line-height: 1.9; }
.html-message { display: block; width: min(980px, 100%); height: 60dvh; margin: 0 auto; border: 0; background: var(--surface); }
.attachments { display: flex; flex-wrap: wrap; gap: 9px; max-width: 980px; margin: 24px auto 0; }
.attachment { display: inline-flex; align-items: center; gap: 8px; min-height: 35px; padding: 5px 11px; border: 1px solid var(--line); border-radius: 9px; color: var(--muted); background: var(--surface); font-size: 12px; }
.attachment:hover { border-color: var(--line); background: var(--soft); }
.reader-actions { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; max-width: 980px; margin: 34px auto 0; padding-top: 20px; border-top: 1px solid var(--line); }
.reader-actions button { min-height: 38px; padding: 0 13px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); font-size: 13px; }

.composer { min-width: 0; min-height: 0; overflow: auto; border-left: 1px solid var(--line); background: var(--surface); }
.composer-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; padding: 30px 26px 21px; border-bottom: 1px solid var(--line); }
.composer-top h2 { margin: 0; font-size: 21px; line-height: 1.35; font-weight: 650; }
.composer-tools { display: flex; align-items: center; gap: 7px; }
.edit-status { padding: 5px 8px; border-radius: 999px; color: var(--muted); background: var(--soft-strong); font-size: 11px; white-space: nowrap; }
.edit-status.unsaved { color: var(--warning); background: var(--warning-bg); }
.source-toggle { min-height: 30px; padding: 0 8px; border: 0; border-radius: 8px; background: transparent; color: var(--muted); font-size: 12px; }
.composer > .headers { margin: 22px 26px 18px; padding: 0 0 18px; font-size: 12px; }
.composer > label { display: block; margin: 0 26px 9px; color: var(--muted); font-size: 12px; font-weight: 550; }
.reply-editor { display: block; width: calc(100% - 52px); min-height: 245px; margin: 0 26px; padding: 15px; border: 1px solid var(--line); border-radius: 12px; outline: 0; resize: vertical; background: var(--surface); font-size: 14px; line-height: 1.75; }
.reply-editor:focus { border-color: var(--line); box-shadow: 0 0 0 3px rgba(20,135,255,.08); }
.signature { margin: 18px 26px 0; padding: 15px; border: 1px solid var(--line); border-radius: 12px; color: var(--muted); background: var(--canvas); white-space: pre-wrap; font-size: 12px; line-height: 1.7; }
.composer .attachments { margin: 18px 26px 0; }
.quoted { margin: 21px 26px 0; border-top: 1px solid var(--line); }
.quoted details { padding-top: 16px; }
.quoted summary { color: var(--muted); cursor: pointer; font-size: 12px; }
.quoted pre { max-height: 220px; margin-top: 13px; padding: 14px; overflow: auto; border-radius: 10px; color: var(--muted); background: var(--soft-strong); white-space: pre-wrap; font: inherit; font-size: 12px; line-height: 1.7; }
.composer-actions { display: flex; flex-wrap: wrap; gap: 8px; padding: 22px 26px 30px; }
.composer-actions button, .dialog-actions button { min-height: 40px; padding: 0 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); font-size: 13px; }
.composer-actions .primary, .dialog-actions .primary { color: var(--inverse); border-color: var(--black); background: var(--black); font-weight: 600; }
.composer-actions .primary:hover, .dialog-actions .primary:hover { background: var(--black); }

.notice { position: fixed; right: 24px; bottom: 24px; z-index: 10; max-width: min(420px, calc(100vw - 48px)); padding: 13px 17px; border: 1px solid var(--line); border-radius: 12px; color: var(--black); background: var(--surface); box-shadow: 0 10px 28px rgba(0,0,0,.12); font-size: 13px; line-height: 1.5; }
.notice.error { color: var(--danger); border-color: var(--line); background: var(--danger-bg); }
dialog { width: min(650px, calc(100vw - 32px)); max-height: min(760px, calc(100dvh - 32px)); padding: 26px; border: 1px solid var(--line); border-radius: 16px; background: var(--surface); box-shadow: 0 24px 70px rgba(0,0,0,.24); }
dialog::backdrop { background: rgba(0,0,0,.28); }
dialog h2 { margin: 0 0 20px; font-size: 20px; }
.review-body { max-height: 360px; padding: 16px; overflow: auto; border-radius: 11px; background: var(--canvas); white-space: pre-wrap; font-size: 13px; line-height: 1.75; }
.dialog-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 22px; }
.preview-image { display: block; max-width: 100%; max-height: 65dvh; margin: 0 auto; object-fit: contain; }
.preview-pdf { width: 100%; height: 65dvh; border: 0; }
dialog a { display: inline-flex; align-items: center; min-height: 40px; padding: 0 14px; border: 1px solid var(--line); border-radius: 10px; color: var(--black); text-decoration: none; font-size: 13px; }

@media (max-width: 1260px) {
  .workspace { grid-template-columns: 190px 350px minmax(0, 1fr); }
  .workspace:has(.composer:not([hidden])) { grid-template-columns: 190px 320px minmax(0, 1fr); }
  .sidebar { padding-left: 12px; padding-right: 12px; }
  .nav-button, .select-nav { padding-left: 17px; padding-right: 17px; }
  .reader-content { padding-left: 34px; padding-right: 34px; }
  .reader-toolbar { padding-left: 24px; padding-right: 24px; }
}

/* The host owns window controls; Relay keeps only working mail controls. */
:root[data-embedded="true"] { --chrome-height: 44px; }
:root[data-embedded="true"] .chrome-bar { padding: 0 12px; }
:root[data-embedded="true"] .run-stop,
:root[data-embedded="true"] .chrome-right .unsupported-action,
:root[data-embedded="true"] .window-logo { display: none; }
:root[data-embedded="true"] .window-title { position: static; flex: 1; min-width: 0; transform: none; background: transparent; padding: 4px 12px; }
:root[data-embedded="true"] .window-title strong { font-size: 13px; }
:root[data-embedded="true"] .chrome-left,
:root[data-embedded="true"] .chrome-right { min-width: 0; }
.app-frame { padding: var(--safe-top, 0px) var(--safe-right, 0px) var(--safe-bottom, 0px) var(--safe-left, 0px); }
.live-status { min-width: 0; max-width: 360px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.live-status[data-state="error"] { color: var(--danger); }
.live-status[data-state="running"]::before { content: ""; width: 7px; height: 7px; flex: 0 0 auto; border-radius: 50%; background: currentColor; }
.composer-actions { position: sticky; bottom: 0; background: var(--surface); border-top: 1px solid var(--line); }

@media (min-width: 721px) and (max-width: 1439px) {
  .workspace.view-source:has(.composer:not([hidden])) { grid-template-columns: 180px 320px minmax(0, 1fr); }
  .workspace.view-source:has(.composer:not([hidden])) .composer { display: none; }
}
@media (min-width: 721px) and (max-width: 1050px) {
  .workspace, .workspace:has(.composer:not([hidden])), .workspace.view-source:has(.composer:not([hidden])) { grid-template-columns: 170px minmax(0, 1fr); }
  .workspace .reader, .workspace:has(.composer:not([hidden])) .reader { display: none; }
  .workspace.reading .mail-list { display: none; }
  .workspace.reading .reader { display: flex; }
  .workspace:has(.composer:not([hidden])) .reader { display: none; }
  .workspace:has(.composer:not([hidden])) .composer { grid-column: 2; }
  .workspace.view-source:has(.composer:not([hidden])) .reader { display: flex; }
}
@media (max-width: 720px) {
  .chrome-bar { padding: 0 10px; }
  .chrome-left, .chrome-right { min-width: 0; gap: 4px; }
  .chrome-right .unsupported-action { display: none; }
  .window-title { position: static; min-width: 0; flex: 1; transform: none; }
  .live-status { font-size: 11px; }
  .sidebar { flex: 0 0 auto; display: block; padding: 13px 12px 10px; border-right: 0; border-bottom: 1px solid var(--line); overflow-x: auto; }
  .sidebar-brand, .sidebar-bottom { display: none; }
  .compose-button { display: inline-flex; width: auto; min-height: 40px; padding: 0 16px; font-size: 14px; vertical-align: middle; }
  .primary-nav { display: inline-flex; flex-direction: row; gap: 3px; margin: 0 0 0 8px; vertical-align: middle; }
  .nav-button { width: auto; min-height: 40px; padding: 0 12px; white-space: nowrap; }
  .nav-button .icon { width: 17px; height: 17px; }
  .nav-button span { display: none; }
  .mail-list { border-right: 0; border-bottom: 1px solid var(--line); }
  .reader-toolbar { min-height: 72px; padding: 16px 20px; overflow-x: auto; }
  .reader-content { overflow: visible; padding: 30px 20px 50px; }
  .reader-heading h2 { font-size: 23px; }
  .composer { border-left: 0; border-top: 1px solid var(--line); }
  .refresh-state { display: none; }
  :root { --chrome-height: 56px; }
  .workspace, .workspace:has(.composer:not([hidden])), .workspace.view-source:has(.composer:not([hidden])) { display: flex; flex-direction: column; height: calc(min(100dvh, var(--host-max-height, 100dvh)) - var(--chrome-height)); min-height: 0; }
  .sidebar { white-space: nowrap; }
  .mail-list, .reader, .composer { flex: 1 1 auto; min-height: 0; }
  .workspace .reader, .workspace .composer { display: none; }
  .workspace.reading .mail-list { display: none; }
  .workspace.reading .reader { display: flex; overflow: auto; }
  .workspace:has(.composer:not([hidden])) .reader { display: none; }
  .workspace:has(.composer:not([hidden])) .composer { display: block; }
  .workspace.view-source:has(.composer:not([hidden])) .reader { display: flex; }
  .workspace.view-source:has(.composer:not([hidden])) .composer { display: none; }
  .reader-content { min-height: 0; }
  .window-title strong { display: none; }
  .live-status { display: inline-flex; }
  .notice { top: calc(var(--chrome-height) + 8px); right: 12px; bottom: auto; max-width: calc(100vw - 24px); }
}
</style>
</head>
<body>
  <div class="app-frame">
    <header class="chrome-bar">
      <div class="chrome-left">
        <button id="sync" class="chrome-button" type="button" aria-label="同步邮件" title="同步邮件">
          <svg class="chrome-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 0 0-14.7-4.3L3 9m0 0V4m0 5h5M4 13a8 8 0 0 0 14.7 4.3L21 15m0 0v5m0-5h-5"/></svg>
        </button>
        <span class="run-stop" aria-label="本地工作台运行中" title="本地工作台运行中"></span>
      </div>
      <div class="window-title" aria-label="OPL Relay 邮箱工作台">
        <span class="window-logo"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="m4 7 8 6 8-6"/></svg></span>
        <strong>Email Workbench</strong>
        <span id="operation-status" class="live-status" role="status" aria-live="polite">正在连接…</span>
      </div>
      <div class="chrome-right">
        <button id="fullscreen" class="chrome-button" type="button" aria-label="全屏" title="全屏">
          <svg class="chrome-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H5a2 2 0 0 0-2 2v3m13-5h3a2 2 0 0 1 2 2v3M8 21H5a2 2 0 0 1-2-2v-3m13 5h3a2 2 0 0 0 2-2v-3"/></svg>
        </button>
        <button class="chrome-button unsupported-action" type="button" aria-label="活动记录" title="活动记录暂未接入">
          <svg class="chrome-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h14v16H5zM8 8h8M8 12h8M8 16h5"/></svg>
        </button>
        <button class="chrome-button unsupported-action" type="button" aria-label="在新窗口打开" title="在新窗口打开暂未接入">
          <svg class="chrome-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 4h6v6M20 4l-9 9M18 13v5a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h5"/></svg>
        </button>
      </div>
    </header>

    <div class="workspace">
      <aside class="sidebar" aria-label="工作台导航">
        <div class="sidebar-brand">
          <span class="brand-mark"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7.5A3.5 3.5 0 0 1 7.5 4h9A3.5 3.5 0 0 1 20 7.5v9a3.5 3.5 0 0 1-3.5 3.5h-9A3.5 3.5 0 0 1 4 16.5z"/><path d="m5 7 7 5 7-5"/></svg></span>
          <span>邮箱工作台</span>
        </div>
        <button id="compose-new" class="compose-button unsupported-action" type="button">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
          <span>写邮件</span>
        </button>
        <nav class="primary-nav" aria-label="邮箱文件夹">
          <button id="inbox" class="nav-button active" type="button" aria-current="page">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v14H4zM4 9h5l2 3h2l2-3h5"/></svg><span>收件箱</span>
          </button>
          <button id="pending" class="nav-button unsupported-action" type="button">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 6h14M5 12h14M5 18h8M3 6h.01M3 12h.01M3 18h.01"/></svg><span>待处理</span>
          </button>
          <button id="drafts" class="nav-button" type="button">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h10l4 4v12H5zM15 4v5h4M8 13h8M8 17h5"/></svg><span>草稿</span>
          </button>
          <button id="sent" class="nav-button" type="button">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m4 5 16 7-16 7 3-7zM7 12h13"/></svg><span>发送记录</span>
          </button>
          <button id="batch" class="nav-button unsupported-action" type="button">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 4h11v13H8zM5 7H4v13h11v-3M11 8h5M11 12h5M11 16h3"/></svg><span>批量任务</span>
          </button>
          <button id="history" class="nav-button" type="button">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7v5l3 2"/></svg><span>历史邮件</span>
          </button>
        </nav>
        <div class="sidebar-bottom">
          <button id="language" class="select-nav unsupported-action" type="button"><span>中文</span><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m7 10 5 5 5-5"/></svg></button>
          <button id="settings" class="nav-button unsupported-action" type="button"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1-1.4 1.4-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5v.2h-2v-.2a1.7 1.7 0 0 0-1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1L9 17l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H7.7v-2h.2a1.7 1.7 0 0 0 1.5-1 1.7 1.7 0 0 0-.3-1.9L9 9l1.4-1.4.1.1a1.7 1.7 0 0 0 1.9.3 1.7 1.7 0 0 0 1-1.5v-.2h2v.2a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1L19.8 9l-.1.1a1.7 1.7 0 0 0-.3 1.9 1.7 1.7 0 0 0 1.5 1h.2v2h-.2a1.7 1.7 0 0 0-1.5 1Z"/></svg><span>邮箱设置</span></button>
        </div>
      </aside>

      <main class="mail-list" aria-label="邮件列表">
        <div class="account-bar">
          <div class="account-select">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="m4 7 8 6 8-6"/></svg>
            <label class="sr-only" for="account">邮箱账号</label>
            <select id="account"></select>
          </div>
          <div class="refresh-state"><span id="freshness">正在连接工作台</span><span class="refresh-label">刷新完成</span></div>
        </div>
        <div class="list-heading"><h1 id="list-title">收件箱</h1></div>
        <form id="search-form" role="search">
          <label class="sr-only" for="search">搜索邮件</label>
          <input id="search" placeholder="搜索此文件夹..." type="search">
          <svg class="icon search-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg>
          <button class="sr-only" type="submit">搜索</button>
        </form>
        <div class="list-controls">
          <button id="folder-filter" class="folder-filter" type="button"><span id="folder-label">收件箱 · INBOX</span><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m7 10 5 5 5-5"/></svg></button>
          <button id="select-mail" class="control-button unsupported-action" type="button"><span>选择邮件</span><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 7h12M6 12h12M6 17h12"/></svg></button>
          <button id="filter-mail" class="icon-button unsupported-action" type="button" aria-label="过滤邮件" title="过滤邮件暂未接入"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M7 12h10M10 18h4"/></svg></button>
          <button id="more-mail" class="icon-button unsupported-action" type="button" aria-label="更多操作" title="更多操作暂未接入"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg></button>
        </div>
        <div class="filter-tabs" role="tablist" aria-label="邮件筛选">
          <button id="filter-all" class="filter-tab active" type="button" role="tab" aria-selected="true">全部</button>
          <button id="filter-unread" class="filter-tab unsupported-action" type="button" role="tab" aria-selected="false" title="未读筛选暂未接入">未读</button>
          <button id="filter-starred" class="filter-tab unsupported-action" type="button" role="tab" aria-selected="false" title="星标筛选暂未接入">星标</button>
        </div>
        <div class="list-meta"><span>已加载 <strong id="count">0</strong> 封</span><span id="unread-summary">当前快照</span></div>
        <div id="message-list" class="message-list" aria-label="邮件列表"></div>
      </main>

      <section class="reader" aria-label="邮件详情">
        <div id="reader-toolbar" class="reader-toolbar"></div>
        <div id="reader-content" class="reader-content">
          <div class="empty-state"><span class="empty-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6.5A2.5 2.5 0 0 1 6.5 4h11A2.5 2.5 0 0 1 20 6.5v11a2.5 2.5 0 0 1-2.5 2.5h-11A2.5 2.5 0 0 1 4 17.5z"/><path d="m5 7 7 5 7-5"/></svg></span><h2>把上下文放在一起</h2><p>选择一封邮件，阅读完整往来；<br>回复所有人、核对附件，再从容发送。</p></div>
        </div>
      </section>
      <section id="composer" class="composer" aria-label="回复草稿" hidden></section>
    </div>
  </div>
  <div id="notice" class="notice" role="status" aria-live="polite" hidden></div>
