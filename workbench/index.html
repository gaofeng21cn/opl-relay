<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>OPL Relay · 邮箱工作台</title>
  <style>/* STYLE */</style>
</head>
<body>
  <div class="app-frame" data-opl-family="opl-apps">
    <header class="chrome-bar">
      <div class="chrome-left">
        <button id="sync" class="chrome-button" type="button" aria-label="同步邮件" title="同步邮件">
          <svg class="chrome-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 0 0-14.7-4.3L3 9m0 0V4m0 5h5M4 13a8 8 0 0 0 14.7 4.3L21 15m0 0v5m0-5h-5"/></svg>
        </button>
        <span class="run-stop" aria-label="本地工作台运行中" title="本地工作台运行中"></span>
      </div>
      <div class="window-title" aria-label="OPL Relay 邮箱工作台">
        <span class="window-logo"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="m4 7 8 6 8-6"/></svg></span>
        <span class="family-label">OPL Apps</span><span class="title-divider" aria-hidden="true">·</span><strong>Email Workbench</strong>
        <span id="operation-status" class="live-status" role="status" aria-live="polite">正在连接…</span>
      </div>
      <div class="chrome-right">
        <button id="fullscreen" class="chrome-button" type="button" aria-label="全屏" title="全屏">
          <svg class="chrome-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H5a2 2 0 0 0-2 2v3m13-5h3a2 2 0 0 1 2 2v3M8 21H5a2 2 0 0 1-2-2v-3m13 5h3a2 2 0 0 0 2-2v-3"/></svg>
        </button>
        <button class="chrome-button unsupported-action" type="button" aria-label="活动记录" title="活动记录暂未接入">
          <svg class="chrome-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h14v16H5zM8 8h8M8 12h8M8 16h5"/></svg>
        </button>
        <button class="chrome-button unsupported-action" type="button" aria-label="在新窗口打开" title="在新窗口打开暂未接入">
          <svg class="chrome-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 4h6v6M20 4l-9 9M18 13v5a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h5"/></svg>
        </button>
      </div>
    </header>

    <div class="workspace">
      <aside class="sidebar" aria-label="工作台导航">
        <div class="sidebar-brand">
          <span class="brand-mark"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7.5A3.5 3.5 0 0 1 7.5 4h9A3.5 3.5 0 0 1 20 7.5v9a3.5 3.5 0 0 1-3.5 3.5h-9A3.5 3.5 0 0 1 4 16.5z"/><path d="m5 7 7 5 7-5"/></svg></span>
          <span>邮箱工作台</span>
        </div>
        <button id="compose-new" class="compose-button unsupported-action" type="button">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
          <span>写邮件</span>
        </button>
        <nav class="primary-nav" aria-label="邮箱文件夹">
          <button id="inbox" class="nav-button active" type="button" aria-current="page">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v14H4zM4 9h5l2 3h2l2-3h5"/></svg><span>收件箱</span>
          </button>
          <button id="pending" class="nav-button unsupported-action" type="button">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 6h14M5 12h14M5 18h8M3 6h.01M3 12h.01M3 18h.01"/></svg><span>待处理</span>
          </button>
          <button id="drafts" class="nav-button" type="button">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h10l4 4v12H5zM15 4v5h4M8 13h8M8 17h5"/></svg><span>草稿</span>
          </button>
          <button id="sent" class="nav-button" type="button">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m4 5 16 7-16 7 3-7zM7 12h13"/></svg><span>发送记录</span>
          </button>
          <button id="batch" class="nav-button unsupported-action" type="button">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 4h11v13H8zM5 7H4v13h11v-3M11 8h5M11 12h5M11 16h3"/></svg><span>批量任务</span>
          </button>
          <button id="history" class="nav-button" type="button">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7v5l3 2"/></svg><span>历史邮件</span>
          </button>
        </nav>
        <div class="sidebar-bottom">
          <button id="connections" class="nav-button" type="button">已连接邮箱</button>
          <button id="language" class="select-nav unsupported-action" type="button"><span>中文</span><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m7 10 5 5 5-5"/></svg></button>
          <button id="settings" class="nav-button unsupported-action" type="button"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1-1.4 1.4-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5v.2h-2v-.2a1.7 1.7 0 0 0-1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1L9 17l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H7.7v-2h.2a1.7 1.7 0 0 0 1.5-1 1.7 1.7 0 0 0-.3-1.9L9 9l1.4-1.4.1.1a1.7 1.7 0 0 0 1.9.3 1.7 1.7 0 0 0 1-1.5v-.2h2v.2a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1L19.8 9l-.1.1a1.7 1.7 0 0 0-.3 1.9 1.7 1.7 0 0 0 1.5 1h.2v2h-.2a1.7 1.7 0 0 0-1.5 1Z"/></svg><span>邮箱设置</span></button>
        </div>
      </aside>

      <main class="mail-list" aria-label="邮件列表">
        <div class="account-bar">
          <div class="account-select">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="m4 7 8 6 8-6"/></svg>
            <label class="sr-only" for="account">邮箱账号</label>
            <select id="account"></select>
          </div>
          <div class="refresh-state"><span id="freshness">正在连接工作台</span><span class="refresh-label">刷新完成</span></div>
        </div>
        <div class="list-heading"><h1 id="list-title">收件箱</h1></div>
        <form id="search-form" role="search">
          <label class="sr-only" for="search">搜索邮件</label>
          <input id="search" placeholder="搜索此文件夹..." type="search">
          <svg class="icon search-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg>
          <button class="sr-only" type="submit">搜索</button>
        </form>
        <div class="list-controls">
          <button id="folder-filter" class="folder-filter" type="button"><span id="folder-label">收件箱 · INBOX</span><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m7 10 5 5 5-5"/></svg></button>
          <button id="select-mail" class="control-button unsupported-action" type="button"><span>选择邮件</span><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 7h12M6 12h12M6 17h12"/></svg></button>
          <button id="filter-mail" class="icon-button unsupported-action" type="button" aria-label="过滤邮件" title="过滤邮件暂未接入"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M7 12h10M10 18h4"/></svg></button>
          <button id="more-mail" class="icon-button unsupported-action" type="button" aria-label="更多操作" title="更多操作暂未接入"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg></button>
        </div>
        <div class="filter-tabs" role="tablist" aria-label="邮件筛选">
          <button id="filter-all" class="filter-tab active" type="button" role="tab" aria-selected="true">全部</button>
          <button id="filter-unread" class="filter-tab unsupported-action" type="button" role="tab" aria-selected="false" title="未读筛选暂未接入">未读</button>
          <button id="filter-starred" class="filter-tab unsupported-action" type="button" role="tab" aria-selected="false" title="星标筛选暂未接入">星标</button>
        </div>
        <div class="list-meta"><span>已加载 <strong id="count">0</strong> 封</span><span id="unread-summary">当前快照</span></div>
        <div id="message-list" class="message-list" aria-label="邮件列表"></div>
      </main>

      <section class="reader" aria-label="邮件详情">
        <div id="reader-toolbar" class="reader-toolbar"></div>
        <div id="reader-content" class="reader-content">
          <div class="empty-state"><span class="empty-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6.5A2.5 2.5 0 0 1 6.5 4h11A2.5 2.5 0 0 1 20 6.5v11a2.5 2.5 0 0 1-2.5 2.5h-11A2.5 2.5 0 0 1 4 17.5z"/><path d="m5 7 7 5 7-5"/></svg></span><h2>把上下文放在一起</h2><p>选择一封邮件，阅读完整往来；<br>回复所有人、核对附件，再从容发送。</p></div>
        </div>
      </section>
      <section id="composer" class="composer" aria-label="回复草稿" hidden></section>
    </div>
  </div>
  <div id="notice" class="notice" role="status" aria-live="polite" hidden></div>
  <script type="module">/* SCRIPT */</script>
</body>
</html>
